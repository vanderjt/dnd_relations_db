name: Verify source

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The historical installer is not needed for source checks. Examples
          # and artwork are ordinary Git files, so no large release download.
          lfs: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-preview.txt
      - name: Python regression tests
        run: python -m unittest discover -s tests -q
      - name: Validate bundled stories
        run: python tools/verify_examples.py
      - name: Install frontend dependencies
        working-directory: preview
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: preview
        run: npm run build
      - name: Check clean and repeatable frontend builds
        working-directory: preview
        run: npm run test:build
      - name: Windows manager regression tests
        if: runner.os == 'Windows'
        shell: powershell
        run: '& ./tests/test_installation_manager.ps1'
      - name: Check tracked files are unchanged
        run: git diff --exit-code
